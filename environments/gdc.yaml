# Persisted config for `make fly-up ENV=gdc` - see scripts/env_config.py's
# module doc for the full schema/precedence. Update this file (not just the
# CLI flags) whenever gdc's intended state changes, so the next `make
# fly-up ENV=gdc` - by anyone, in any session - reproduces it without
# having to remember/repeat every flag from scratch.
#
# Purpose: demonstrate Vega ZK end-to-end, and test real BLE/NFC proximity
# presentation using a credential issued by the Geneva 2026 interop event's
# reference issuer (geneva2026.mdoc.online).

# gdc's machines already run here, and a named, shared environment pins its
# own region so it does not land somewhere different depending on who
# redeployed it. Without this it would follow whoever ran fly-up (Fly's
# suggestion is per-machine - from Stockholm it answers 'fra'), leaving the
# fly.toml disagreeing with where the machines actually are.
region: arn

# Resolve every SD-JWT credential type from the SIROS registry instead of the
# VCTMs vendored in fixtures/vc-metadata (REGISTRY=external, PR #33). This is
# what makes vc ADVERTISE the type's real vct (urn:eudi:pid:arf-1.8:1) in
# credential_configurations_supported - for a vendored VCTM it advertises its
# own /type-metadata/<scope> URL while the issued credential carries the urn,
# and the wallets (siros-sdk-kotlin 0.13, wallet-frontend) refuse that
# mismatch: "Issuer delivered a 'urn:eudi:pid:arf-1.8:1' credential, but this
# offer was for https://sirosid-gdc-vc-apigw.fly.dev/type-metadata/pid_1_8".
# mdoc types stay vendored (mdl_zk4 has no registry entry).
credential_registries:
  - https://registry.siros.org

