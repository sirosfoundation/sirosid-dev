# Persisted config for `make fly-up ENV=gdc` - see scripts/env_config.py's
# module doc for the full schema/precedence. Update this file (not just the
# CLI flags) whenever gdc's intended state changes, so the next `make
# fly-up ENV=gdc` - by anyone, in any session - reproduces it without
# having to remember/repeat every flag from scratch.
#
# Purpose: demonstrate Vega ZK end-to-end, and test real BLE/NFC proximity
# presentation using a credential issued by the Geneva 2026 interop event's
# reference issuer (geneva2026.mdoc.online).

# gdc's machines already run here, and a named, shared environment pins its
# own region so it does not land somewhere different depending on who
# redeployed it. Without this it would follow whoever ran fly-up (Fly's
# suggestion is per-machine - from Stockholm it answers 'fra'), leaving the
# fly.toml disagreeing with where the machines actually are.
region: arn

# Resolve every SD-JWT credential type from the SIROS registry instead of the
# VCTMs vendored in fixtures/vc-metadata (REGISTRY=external, PR #33). This is
# what makes vc ADVERTISE the type's real vct (urn:eudi:pid:arf-1.8:1) in
# credential_configurations_supported - for a vendored VCTM it advertises its
# own /type-metadata/<scope> URL while the issued credential carries the urn,
# and the wallets (siros-sdk-kotlin 0.13, wallet-frontend) refuse that
# mismatch: "Issuer delivered a 'urn:eudi:pid:arf-1.8:1' credential, but this
# offer was for https://sirosid-gdc-vc-apigw.fly.dev/type-metadata/pid_1_8".
# mdoc types stay vendored (mdl_zk4 has no registry entry).
credential_registries:
  - https://registry.siros.org

images:
  # vc: BUILT LOCALLY (2026-10-20). The ISSUER side (registry, issuer, apigw) is sirosfoundation/vc
  # `integration/gdc-nymauth-v4` @ 5e546b2d61d4756f04b39ea84d26cf6b18b830ba (v3 20ab021 + startup refusals for a delivering
  # scope without notification_endpoint / credential_encryption.keys + a 'Delivered a secret seed' INFO log line) = SUNET/vc main + #793 (seed derivation
  # in the apigw, `apigw.seeds`: BREAKING - an image without it silently ignores the key and issues no ssc) + #796 +
  # #820 (verifier V1) + #821 (seed delivery: `deliver: true`, advertises org.siros.secret_seed; v3 fixes a leak:
  # before 52e4ad2db a delivered seed could overwrite the PUBLISHED issuer metadata when
  # emit_credential_metadata_on_response was true, and a refused delivery burned a status-list index) + #813
  # (identity_attributes / document_claims). NOT for upstream merge. Built on current main, so it also brings #809
  # (mdoc DeviceAuthentication per ISO 18013-5, which our SDKs do not produce yet) and #790 (SD-JWT holder
  # binding). The VERIFIER stays at the 6c3ac47 build (local-1792456320, same ZK pins) until someone wants the
  # nymauth library build on gdc: V2/v3 add NO verifier config or service wiring, so it verifies no nym_auth yet.
  # emit_credential_metadata_on_response stays OFF (default): seed delivery does not need it. The verifier is
  # built with the two native ZK libraries pinned by FULL SHA (--build-arg ZK_CRED_LONGFELLOW_REF=cf2eba99...,
  # ZK_CRED_VEGA_REF=d6f0955b...: a shallow fetch needs all 40 characters), --target runtime-verifier.
  #
  # Build the first image alone: `make install-tools` in the shared gobuild stage failed when four builds raced it.
  # Before this: plain main @ 4bba38e61 (2026-10-13) + #813; before that a879fcb9a (unmerged #771).
  # It must be newer than dc4c08e4f: that one had #507/#751 (an OIDC login with an empty
  # identity-mapping namespace is refused, IDENTITY_MAPPING_NAMESPACE_REQUIRED) without #735 (the per-scope authentic_source
  # key; values-base.yaml issuer.datastoreAuthenticSource supplies it), so every issuance failed on it.
  # Build recipe, per service (registry issuer verifier apigw):
  #   docker build -f dockerfiles/worker --build-arg SERVICE_NAME=<svc> \
  #     -t registry.fly.io/sirosid-gdc-vc-<svc>:local-<epoch> .   # then docker push (flyctl auth docker)
  # `make docker-build VERSION=<tag>` builds all four; the images are then retagged to
  # registry.fly.io/sirosid-gdc-vc-<svc> and pushed (flyctl auth docker).
  # The verifier used to need `--target runtime-verifier` - a bare build picked a stage with no
  # libzk_cred_longfellow.so / libzk_cred_vega.so and it died at start with "error while loading
  # shared libraries" (2026-10-08). dockerfiles/worker has ONE runtime stage now and ships both,
  # verified in the 2026-10-12 image; drop this note once nobody remembers the old shape.
  # The Dockerfile's default GOBUILD_IMAGE is golang:1.27.2-bookworm now (6c3ac47 and later), matching its runtime stage's
  # glibc, so no override is needed (an older default built binaries that died with "GLIBC_2.39 not found").
  #
  # All four vc-services MUST be bumped together: they share one config shape unmarshaled into the same
  # model.Cfg, so leaving one on an older binary while another expects a newer shape crash-loops it.
  # All four come from the one integration build above.
  #
  # Not yet on main, and therefore NOT in this build: SUNET/vc#782, which
  # makes the ZK Proofs presets visible on the verifier's landing page -
  # both of them are categorised and neither is featured, so they still sit
  # behind "Show more presets" here.
  vc-verifier: registry.fly.io/sirosid-gdc-vc-verifier:local-1792456320
  vc-apigw: registry.fly.io/sirosid-gdc-vc-apigw:local-1792473614
  vc-issuer: registry.fly.io/sirosid-gdc-vc-issuer:local-1792473614
  vc-registry: registry.fly.io/sirosid-gdc-vc-registry:local-1792473614

  # Pinned here rather than in values-fly.yaml because that file is shared by
  # every Fly environment and this is gdc's pin, not a vetted default for all
  # of them - the shared pin stays where it is until someone decides it should
  # move.
  #
  # gdc ran 0.15.2 until 2026-09-07, when a redeploy for an unrelated
  # whitelist change picked up values-fly.yaml's 0.18.0 as a side effect;
  # nobody chose 0.18.0 for this environment. 0.15.2 -> 0.18.0 -> 0.19.0.
  #
  # Then a local build, for two engine fixes that had not been released:
  #   #336 the no-matching-credential fast fail, against the two SDKs that now
  #        send it (siros-sdk-kotlin #192, siros-sdk-swift #149, both merged)
  #   #343 accept OpenID4VP 1.0's "decentralized_identifier" name for the DID
  #        client_id scheme. Without it a verifier built against the final
  #        specification is refused before its request is read - which is
  #        exactly where a presentation from Accredify's ACRA verifier stopped,
  #        after its request object had been fetched successfully.
  #
  # Both merged and shipped in v0.22.0, so the local build is retired here.
  # It is worth knowing what it was, because it was never reproducible: it
  # combined the two PR branches at their 2026-09-18 state, the combination
  # was never committed, and it predates the review change that gave #336 its
  # shared refusal description - so it matched neither merged PR. Read out of
  # the image itself on 2026-09-21, the only place it still existed.
  # 0.22.0 -> 0.22.1: the SSRF address guard on POST /helper/get-cert (#358)
  # and a recover() that is now registered before the flow_id log truncation,
  # so a panic in handleFlowStart is caught rather than taking the process
  # down (#357). The shared default moved to 0.22.1 in the same change; this
  # pin stays because it is what stopped gdc drifting the last time the
  # shared one moved under it.
  # 0.22.1 -> 0.22.3 (2026-10-08 refresh: the last released versions of everything but vc).
  # 2026-10-20: 0.23.0 -> 0.24.0 (relays the OID4VCI 1.1 response-level credential_metadata - the seed delivery
  # - and requires an encrypted response when the issuer advertises it; config unchanged, checked against the
  # rendered gdc config). 2026-10-15: 0.22.3 -> 0.23.0 (the security overhaul: token revocation by family, PDP-first verifier trust,
  # as.audiences defaulted, the registry as a role). The rendered config loads unchanged; it still mounts the now
  # DEPRECATED /app/registry.yaml (a warning, to be removed in the next release - move it into config.yaml's
  # `registry:` section, which the deploy already supports by not rendering wallet-backend-registry.yaml).
  # 2026-10-20: BUILT LOCALLY from sirosfoundation/go-wallet-backend `feat/oid4vci-request-encryption` @
  # e4e0bc3bd1fd800a7507a50d33b1703c6224100b (PR #469, not merged; base main cb42861 = 0.24.0 + the refactor merge; replaced 4e93c15 after review):
  # the engine encrypts the credential REQUEST as a JWE to credential_request_encryption.jwks (OID4VCI 1.0 section 10)
  # and negotiates the response encryption (all ECDH-ES(+KW) x GCM/CBC pairs) - what seed delivery needs (the issuer refuses a plain request for
  # a delivering scope). No config keys added; checked against the rendered gdc config. Back to the released image
  # (ghcr.io/sirosfoundation/go-wallet-backend:<release containing #469>) once it is merged and released.
  # Build: docker build -f Dockerfile --build-arg VERSION=0.24.0-reqenc.e4e0bc3 --build-arg COMMIT=<sha> \
  #   -t registry.fly.io/sirosid-gdc-wallet-backend:local-<epoch> .   # then docker push (flyctl auth docker)
  wallet-backend: registry.fly.io/sirosid-gdc-wallet-backend:local-1792473614

  # The rest of the SIROS components, at the last RELEASED version as of 2026-10-08. Pinned here, not in
  # values-fly.yaml (shared by every environment), so gdc moves when someone chooses to move it.
  #   go-trust (the PDP): 0.20.7 -> 0.24.1. The unknown-config-key warning announced in 0.23.0 did not
  #     become a startup error in 0.24.0, so the rendered pdp config is unaffected.
  # 2026-10-15: 0.24.1 -> 0.25.0. Its image sets GT_HOST=0.0.0.0 GT_PORT=6001 and the environment BEATS the
  # config file, so the PDP listened on 6001 while everything addresses 8080; fly-up now sets GT_PORT/GT_HOST
  # itself (deploy.py, singlemachine.py). The LoTE verify_jws change is not used here.
  pdp: ghcr.io/sirosfoundation/go-trust:0.25.0
  #   wallet-frontend: 0.5.0-1-sirosid.10 -> .11, the newest sirosid-flavoured image that is published
  #     (the v0.5.0-sirosid.12/.13 git tags have no image; v0.6.0 is the main line, not this flavour).
  wallet-frontend: ghcr.io/sirosfoundation/wallet-frontend:0.5.0-1-sirosid.11
  #   mini-oidc 0.0.5 and env-admin 0.1.1 are already the newest releases (the values-fly.yaml pins).

# geneva2026.mdoc.online: the Geneva 2026 interop test event's reference
# mdoc issuer - trusted here so a wallet can receive a credential from it
# for the proximity-presentation test.
trusted_issuers:
  - https://geneva2026.mdoc.online
  # yitbarek's issuer. The issuer identity is the APIGW's public URL (its credential_issuer, with keys at
  # /.well-known/jwt-vc-issuer); there is no public ...-vc-issuer host (that app is internal), so trusting
  # it never resolved and the PDP could not fetch its keys.
  - https://sirosid-yitbarek-vc-apigw.fly.dev

# Every OpenID4VP verifier used for interop testing so far - each needs its
# own reader-CA root below (ISO 18013-5 out-of-band trust convention, not a
# public CA) since none of their request-signing certs chain to a system CA.
# geneva2026.mdoc.online's own reader-CA root uses the brainpoolP256r1 curve
# (a real ISO 18013-5/eIDAS reader-CA convention) - this needed go-trust#153
# (fixed in 0.20.5, see values-fly.yaml's images.pdp comment) before
# additional_trusted_roots could parse it at all; briefly broke trust for
# the multipaz verifiers too on 2026-08-31 before that fix landed. See
# fixtures/trusted-roots/README.md for the full story on both roots.
trusted_verifiers:
  - https://verifier.multipaz.org
  - https://siros-multipaz-verifier.fly.dev
  - https://geneva2026.mdoc.online
  - https://sirosid-yitbarek-vc-verifier.fly.dev
  # Google's public DC API test site, for browser-initiated presentation
  # testing. Written as the plain origin because that is what a whitelist
  # match actually compares against: an unsigned DC API request carries no
  # signing certificate, so the subject is the origin Chrome verified, and a
  # signed one using the x509_san_dns scheme is normalized to
  # https://<host> before the match runs. Only x509_hash: subjects are
  # compared un-normalized, and if the site's signed requests turn out to use
  # that scheme it needs its hash added verbatim alongside this - the PDP's
  # denial message quotes the exact string to paste.
  #
  # No reader-CA root below: the site's request-signing certificate is
  # self-signed rather than chained (see values-fly.yaml's 0.12.1 -> 0.13.0
  # note), so it is trusted by hash-pinning rather than by chain validation,
  # which is the one scheme go-trust deliberately skips chain validation for.
  - https://digital-credentials.dev
  # And its signed requests, which do use the x509_hash scheme - confirmed
  # from the PDP's own denial on 2026-09-07:
  #
  #   whitelist denied request subject=x509_hash:f1drGLOIT4kDBlJVsD-_33igSf5uwRnq3yO2NvcXEW0
  #     reason="subject not in whitelist for action 'credential-verifier'"
  #
  # Pasted verbatim because x509_hash: subjects are compared un-normalized,
  # unlike x509_san_dns:/x509_san_uri: which are reduced to https://<host>
  # first. The origin entry above therefore cannot match a signed request, and
  # this entry cannot match an unsigned one - both are needed.
  #
  # Hash-pinning is itself the trust decision for this scheme, so go-trust
  # skips chain validation and no reader-CA root is required.
  - x509_hash:f1drGLOIT4kDBlJVsD-_33igSf5uwRnq3yO2NvcXEW0
  # Accredify's ACRA UAT verifier, added 2026-09-17 for interop testing.
  #
  # It identifies itself with did:web, confirmed from its own DID document at
  # https://acra.uat.accredify.io/.well-known/did.json (id
  # "did:web:acra.uat.accredify.io", one JsonWebKey2020 verification method
  # "#jwk-1"). That is the string the whitelist has to carry: NormalizeSubjectID
  # rewrites x509_san_dns:/x509_san_uri: subjects, and, as of go-trust 0.20.7
  # (go-trust#165, see values-fly.yaml's pdp pin comment), also strips OpenID4VP
  # 1.0's decentralized_identifier: prefix before any registry sees the subject
  # - so their requests, which carry the client_id as
  # decentralized_identifier:did:web:acra.uat.accredify.io, normalize down to
  # this same bare DID before the whitelist match runs. One entry now covers
  # both spellings; it used to need two, until the deployed PDP picked up the
  # fix. The key behind it is resolved by the did:web registry enabled under
  # `values.pdp.extraRegistries` below - the whitelist authorizes the
  # identity, the registry supplies its keys, and neither substitutes for the
  # other.
  - did:web:acra.uat.accredify.io
  # The plain origin as well, which is what an unsigned DC API request reduces
  # to - that path carries no signing certificate and so no DID.
  - https://acra.uat.accredify.io
trusted_verifier_roots:
  - fixtures/trusted-roots/multipaz-reader-ca.pem
  - fixtures/trusted-roots/siros-multipaz-verifier-reader-ca.pem
  - fixtures/trusted-roots/geneva2026-verifier-reader-ca.pem

# Vega's r12 circuit isn't published to the default zk-circuits.fly.dev
# catalog yet (pending expert review) - this is where it actually lives.
zk_circuits_sources:
  - https://zk-circuits-test.fly.dev

# The sample app's signing keys, so wallet-backend's rp_origins (the
# server-side WebAuthn accept-list) contains the apk-key-hash the app
# actually presents. Without a matching entry, /auth/passkey/register/finish
# fails with "Error validating origin" and signup returns 400 - while login
# with an already-registered passkey keeps working, which makes it look like
# a server regression rather than a missing accept-list entry.
#
# Persisted here on purpose. These previously lived only in `.android-apps`,
# which is gitignored and per-checkout, so a `make fly-up ENV=gdc` from any
# working copy that happened not to have that file silently deployed an
# rp_origins with the app's keys missing - which is exactly what happened on
# 2026-09-07. Environment state that the environment needs belongs in the
# environment file, where anyone's next deploy reproduces it.
#
# Three keys, all for org.siros.sdk.sample: the repo's committed debug
# keystore (sample-app/debug.keystore - what CI and a clean checkout build
# with), a local per-developer debug keystore, and an older one kept so
# devices still carrying that build can log in. `.android-apps` is still read
# and still adds to this; nothing here replaces it.
android_apps:
  - org.siros.sdk.sample=A4:DF:EC:00:09:BF:CA:CD:A4:67:F7:D4:6D:A0:AD:96:1C:4E:38:D2:4F:42:5C:6A:21:7F:98:69:9C:C5:82:14
  - org.siros.sdk.sample=C4:07:F2:6D:C3:B4:C8:F9:54:03:F1:A4:A3:6B:47:EA:82:11:6F:D6:3E:A9:AD:EE:56:D9:B4:9B:FA:96:D3:B4
  - org.siros.sdk.sample=46:56:F0:24:08:55:32:F0:94:0F:53:60:A2:0E:6A:31:9A:0B:57:5B:38:C6:BD:F8:48:B6:95:09:39:CB:B0:2F

wallet_attestation: true

# Geneva 2026 interop event's RICAL (ISO 18013-5 2nd ed. Annex F reader-trust
# list) - registers PDP's mdocrical registry so BLE/NFC proximity
# presentation's mdoc-reader-auth check can trust the event's reader tools.
# See fixtures/trusted-roots/README.md for provenance of the root cert.
rical_provider_url: https://geneva2026.mdoc.online/TrustedLists/Rical.rical
rical_root_cert: fixtures/trusted-roots/geneva2026-rical-root.pem

# Free-form chart values, deep-merged last - see scripts/env_config.py and
# environments/README.md. Anything the chart can express is reachable here
# without a code change anywhere else.
values:
  issuer:
    apigw:
      # nym_auth's seed-backed ssc and its delivery (SUNET/vc#793/#821; the integration build pinned above):
      # the issuer derives each person's seed from a per-environment secret (generated once, PERMANENT) and the
      # wallet receives it encrypted, which needs the published credential-encryption key. Verified end to end on a
      # Pixel 2026-10-20 (sirosid-dev PR 78). The other environments run images without it, so it is off by default.
      seeds:
        primary:
          model: derived
      credentialEncryption:
        enabled: true
  pdp:
    # Resolve entities identified by did:web, so a presentation from a wallet
    # to - or an issuer identified by - a did:web subject can be evaluated at
    # all. Additive: it registers one more resolver alongside the whitelist and
    # the mdoc registries, and changes nothing about how this environment's own
    # issuer and verifier identify themselves (still x509_san_dns, derived from
    # their public URLs).
    #
    # Turning gdc's OWN verifier into a did:web identity is a different switch
    # (verifier.clientIdScheme: "did" plus verifier.did), and it would need
    # every whitelist entry naming the current x509_san_dns identity revisited.
    extraRegistries:
      didweb:
        enabled: true
        name: "did:web"
        description: "did:web DID document resolution"
        timeout: 10s
  verifier:
    # The verifier's client_id is x509_san_dns:sirosid-gdc-vc-verifier.fly.dev; put that host in the SAN of the
    # certificate it signs request objects with (re-issued once from the same key and root; see create-pki.sh).
    signingCertDnsSan: true
    # Selectable options in the verifier's own presentation-definition UI.
    # NOT the same thing as presentation-request templates, which are only
    # reachable through a real OIDC /authorize?scope=... request.
    #
    # This lives here rather than in values-base.yaml because the
    # category/credentials/zk_system_type shape only exists on the Vega ZK
    # branch the images pinned above are built from - a verifier built from
    # vc main panics on it at startup.
    # Selectable options in the verifier's own presentation-definition UI. NOT
    # the same thing as presentationRequestTemplates below, which are only
    # reachable through a real OIDC /authorize?scope=... request.
    #
    # The chart passes presets through verbatim, which matters here: this shape
    # (category/credentials/zk_system_type) is only understood by the vc build
    # pinned in environments/gdc.yaml, not by vc main.
    presets:
      "PID (mdoc) - ZK Proof (Vega)":
        category: "ZK Proofs"
        credentials:
          mdl_zk4:
            format: "mso_mdoc_zk"
            zk_system_type:
              - id: "vega-mc-p256-v1-prover-key-r12"
                system: "vega-mc-p256-v1"
            claims:
              - path: ["org.iso.18013.5.1", "family_name"]
              - path: ["org.iso.18013.5.1", "given_name"]
      "Age Over 18 - ZK Proof (Vega)":
        category: "ZK Proofs"
        credentials:
          mdl_zk4:
            format: "mso_mdoc_zk"
            zk_system_type:
              - id: "vega-mc-p256-v1-prover-key-r12"
                system: "vega-mc-p256-v1"
            claims:
              - path: ["org.iso.18013.5.1", "age_over_18"]
