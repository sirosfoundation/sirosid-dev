# Docker Compose overlay for Android development via Waydroid.
#
# Usage:
#   docker compose -f docker-compose.test.yml \
#     -f docker-compose.vc-services.yml \
#     -f docker-compose.go-trust-allow.yml \
#     -f docker-compose.android.yml \
#     up -d
#
# Or via the android-test.sh helper:
#   ./scripts/android-test.sh restart
#
# Prerequisites:
#   - Run `make android-config` first: it re-renders the vc services' config
#     from the chart with the apigw and mini-oidc advertised at the Waydroid
#     gateway address rather than the host's own localhost, which the device
#     cannot reach. (This used to be a separately pre-patched copy of the
#     whole config file, mounted here.)
#   - Waydroid running with ADB accessible.
#
# This overlay only sets mini-oidc's ISSUER to the host gateway, so the ID
# token issuer matches the vc-apigw OIDC RP's issuer_url; everything else
# comes from the rendered config.

services:
  mini-oidc:
    environment:
      - ISSUER=http://${WAYDROID_GATEWAY:-192.168.240.1}:9005
