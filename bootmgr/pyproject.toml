[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sirosid-bootmgr"
version = "0.1.0"
description = "Boot manager for sirosid-dev: a terminal UI over make up/down, Fly environments and storage"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.86,<9",
    "pyyaml>=6",
]

[project.scripts]
sirosid-dev = "sirosid_bootmgr.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sirosid_bootmgr*"]
