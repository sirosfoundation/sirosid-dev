# VC Services Docker Compose for E2E Testing
#
# This file provides production-grade VC issuer, verifier, registry, and apigw
# services as an alternative to the mock services in docker-compose.test.yml.
#
# Usage:
#   make up-vc              # Start VC services
#   make up-vc-go-trust     # Start VC services with go-trust PDP
#   make test-vc            # Run tests with VC services
#   make down-vc            # Stop VC services
#
# Note: This configuration is designed to work alongside docker-compose.test.yml
# The VC services replace mock-issuer (9000), mock-verifier (9001).
#
# Configuration (via environment variables):
#   VC_PATH     - Path to SUNET/vc source code (default: ../vc)
#   VC_ISSUER_URL - External issuer URL for whitelist (default: http://localhost:9000)
#   VC_VERIFIER_URL - External verifier URL for whitelist (default: http://localhost:9001)

services:
  # MongoDB - persistent storage for VC services
  mongodb:
    # Pinned to match the siros-id-stack chart's values.yaml's
    # images.mongoCommunityVersion, so local testing uses the same Mongo
    # version production runs (via the MongoDB Community Operator).
    image: mongo:7.0.24
    container_name: vc-mongodb-e2e
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-test-network

  # VC Registry - Token status lists and revocation
  # Required by issuer for credential status management
  vc-registry:
    build:
      context: ${VC_PATH:-../vc}
      dockerfile: dockerfiles/worker
      args:
        SERVICE_NAME: registry
    image: vc-registry-e2e-test:local
    container_name: vc-registry-e2e
    ports:
      - "9004:8080"     # HTTP API
      - "9094:8090"     # gRPC for inter-service communication
    volumes:
      - ./fixtures/vc-config.yaml:/config.yaml:ro
      - ./fixtures/vc-pki:/pki:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - e2e-test-network

  # VC Issuer - Production-grade OpenID4VCI credential issuer
  vc-issuer:
    build:
      context: ${VC_PATH:-../vc}
      dockerfile: dockerfiles/worker
      args:
        SERVICE_NAME: issuer
    image: vc-issuer-e2e-test:local
    container_name: vc-issuer-e2e
    ports:
      - "9000:8080"     # HTTP API (OpenID4VCI endpoints)
      - "9190:8090"     # gRPC for apigw communication
    volumes:
      # Local-patched (fixtures/vc-config.yaml's own "https://vc-proxy:8443"
      # only resolves under CONFORMANCE=yes/TUNNELS=yes - see the Makefile's
      # `up:` target and scripts/generate-tunnel-config.py). CONFORMANCE=yes
      # overrides this back to the raw file (docker-compose.conformance.yml).
      - ./fixtures/vc-config-local.yaml:/config.yaml:ro
      - ./fixtures/vc-pki:/pki:ro
      - ./fixtures/vc-metadata:/metadata:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
      vc-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - e2e-test-network

  # VC Verifier - Production-grade OpenID4VP verifier with OIDC Provider
  vc-verifier:
    build:
      context: ${VC_PATH:-../vc}
      dockerfile: dockerfiles/worker
      args:
        SERVICE_NAME: verifier
    image: vc-verifier-e2e-test:local
    container_name: vc-verifier-e2e
    ports:
      # Host and container port MUST match, same as vc-apigw above: an
      # OpenID4VP presentation redirect sends the browser to the verifier,
      # while wallet-backend reaches it over the compose network, and the one
      # URL it advertises has to work for both.
      - "9001:9001"     # HTTP API (OpenID4VP + OIDC endpoints)
      - "9091:8090"     # gRPC
    volumes:
      - ./fixtures/vc-config-local.yaml:/config.yaml:ro
      - ./fixtures/vc-pki:/pki:ro
      - ./fixtures/vc-metadata:/metadata:ro
      - ./fixtures/vc-presentation-requests:/presentation_requests:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      e2e-test-network:
        # See vc-apigw's alias below - same mechanism, same reason.
        aliases:
          - vc-verifier.localhost

  # VC API Gateway - OAuth2 Authorization Server for OpenID4VCI
  # Handles user authentication (OIDC/SAML) and credential offer generation
  vc-apigw:
    build:
      context: ${VC_PATH:-../vc}
      dockerfile: dockerfiles/worker
      args:
        SERVICE_NAME: apigw
    image: vc-apigw-e2e-test:local
    container_name: vc-apigw-e2e
    ports:
      # Host and container port MUST match: apigw advertises ONE public URL
      # (see the Makefile's VC_APIGW_PUBLIC_URL) that both the compose network
      # and the host browser have to be able to use, and a URL carries one
      # port. The generated vc-config-local.yaml repoints api_server.addr to
      # 9003 to suit. CONFORMANCE=yes overrides this back to 9003:8080, since
      # it mounts the base config (addr :8080) and fronts apigw with vc-proxy.
      - "9003:9003"     # HTTP API (OAuth2/OpenID4VCI endpoints)
    volumes:
      # Local-patched - see the matching comment on vc-issuer's mount above.
      - ./fixtures/vc-config-local.yaml:/config.yaml:ro
      - ./fixtures/vc-pki:/pki:ro
      - ./fixtures/vc-metadata:/metadata:ro
      - ./fixtures/vc-bootstrapping:/bootstrapping:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
      vc-issuer:
        condition: service_healthy
      vc-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9003/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      e2e-test-network:
        # Lets containers reach apigw at the SAME hostname the browser uses,
        # resolved by docker's embedded DNS straight to this container - so the
        # in-network hop never touches a published port. See the Makefile's
        # VC_APIGW_PUBLIC_URL for why that matters.
        aliases:
          - vc-apigw.localhost

  mini-oidc:
    image: ghcr.io/sirosfoundation/mini-oidc:${MINI_OIDC_VERSION:-main}
    container_name: mini-oidc-e2e
    command: ["/usr/local/bin/op"]
    ports:
      - "9005:9005"
    environment:
      - CONFIG_FILE=/etc/mini-oidc/configs/config.production.yaml
      - USERS_FILE=/etc/mini-oidc/users.yaml
      - ISSUER=${MINI_OIDC_ISSUER:-http://mini-oidc:9005}
      - RP_BASE_URL=${MINI_OIDC_RP_URL:-http://mini-oidc-rp:9006}
      - CLIENT_ID=${MINI_OIDC_CLIENT_ID:-mini-oidc-rp}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "9005"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      e2e-test-network:
        # Same alias mechanism as vc-apigw - the browser is redirected to
        # mini-oidc's /authorize page while apigw does discovery against it
        # server-side, so both sides need one working URL. Ports already match
        # (9005:9005), so only the alias is needed.
        aliases:
          - mini-oidc.localhost

  mini-oidc-rp:
    image: ghcr.io/sirosfoundation/mini-oidc:${MINI_OIDC_VERSION:-main}
    container_name: mini-oidc-rp-e2e
    command: ["/usr/local/bin/rp"]
    ports:
      - "9006:9006"
    environment:
      - CONFIG_FILE=/etc/mini-oidc/configs/config.production.yaml
      - ISSUER=${MINI_OIDC_ISSUER:-http://mini-oidc:9005}
      - RP_BASE_URL=${MINI_OIDC_RP_URL:-http://mini-oidc-rp:9006}
      - CLIENT_ID=${MINI_OIDC_CLIENT_ID:-mini-oidc-rp}
    depends_on:
      mini-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "9006"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      e2e-test-network:
        aliases:
          - mini-oidc-rp.localhost

networks:
  e2e-test-network:
    name: e2e-test-network
    external: true

volumes:
  mongodb-data:
