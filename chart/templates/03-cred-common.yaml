
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vctms
  namespace: {{ include "siros-id.namespace" . }}
  {{- include "siros-id.labels" (list . (dict)) | nindent 2 }}
  {{- include "siros-id.annotations" (list . (dict)) | nindent 2 }}
data:
  .empty: "I am here so that the configmap won't ever be empty"
  {{- range $id, $data := .Values.features.credentialTypes }}
  {{- /* A twin's metadata IS its source's file (metadataFrom): a second copy only doubles what every vc service
         ships to Fly, whose machine config body is capped near 1 MiB. */}}
  {{- if $data.metadataFrom }}
  {{- else if $data.mdocSchema }}
  {{/* An ISO 18013-5 mdoc type carries an MDDL schema instead of a VCTM.
       The .mdoc.json suffix is what siros-id.vc.credentialMetadata points
       mddl_file_path at, and is the only thing distinguishing the two on
       disk - vc validates that an mso_mdoc scope has one and not the other. */}}
  {{ $id }}.mdoc.json: | {{- include "siros-id.dataOrFile" (list $ $data.mdocSchema) | nindent 4 }}
  {{- else if $data.vctm }}
  {{ $id }}.json: | {{- include "siros-id.dataOrFile" (list $ $data.vctm) | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- /* A VCTM for a scope only the verifier has (verifier.extraVctms, written into verifier.extraConfig as
         vctm_file_path: /vctms/<name>.json): vc loads a schema for EVERY non-mdoc scope, ldp_vc included. */}}
  {{- range $name, $doc := .Values.verifier.extraVctms }}
  {{ $name }}.json: {{ (kindIs "string" $doc | ternary $doc ($doc | toJson)) | quote }}
  {{- end }}
