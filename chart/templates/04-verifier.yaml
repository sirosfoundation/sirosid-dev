{{- $ns := include "siros-id.namespace" . -}}
{{- $hostnameVerifier := include "siros-id.hostname.verifier" . -}}
{{- $hostnameWalletFrontend := include "siros-id.hostname.walletFrontend" . -}}
{{- $basePathWalletFrontend := include "siros-id.hostname.walletFrontendBasePath" . -}}

{{/*
The verifier's config.yaml body (vc's model.Cfg: common + verifier).

Kept as a named template rather than inline in the ConfigMap so that
siros-id.vc.renderConfig can parse it, deep-merge .Values.verifier.extraConfig
over it, and re-emit it - see that helper for the merge semantics.

Note that verifier.public_url is not merely an address: vc derives the
OpenID4VP client_id from it (VerifierClientID() returns
"x509_san_dns:<host>"), so changing it changes this verifier's identity to
every relying party and to the PDP whitelist.
*/}}
{{- define "siros-id.verifier.config" -}}
{{- $hostnameVerifier := include "siros-id.hostname.verifier" . -}}
{{- $hostnameWalletFrontend := include "siros-id.hostname.walletFrontend" . -}}
{{- $basePathWalletFrontend := include "siros-id.hostname.walletFrontendBasePath" . -}}
common:
  {{- include "siros-id.vc.config.mongo" (list . "verifier") | nindent 2 }}
  secret_file_path: /secrets-rendered/secrets.yaml
  production: {{ .Values.features.production }}
  ha:
    enable: true
    cache_database_name: verifier_cache
  {{- include "siros-id.vc.config.tracing" . | nindent 2 }}
  branding:
    favicon_path: /branding-assets/favicon.png
    logo_path: /branding-assets/logo.png
  credential_metadata: {{- include "siros-id.vc.credentialMetadata" . | nindent 4 }}
verifier:
  public_url: https://{{ $hostnameVerifier }}
  api_server:
    addr: ":8080"
  key_config:
    private_key_path: /sign-cert/tls.key
    chain_path: /sign-cert-chain/tls.crt
  trust:
    pdp_url: {{ .Values.pdp.externalUrl | quote }}
    {{- if .Values.verifier.walletAttestation.enabled }}
    wallet_attestation: {{- include "siros-id.vc.config.walletAttestation" .Values.verifier.walletAttestation | nindent 6 }}
    {{- end }}
  {{- with .Values.verifier.clientIdScheme }}
  client_id_scheme: {{ . | quote }}
  {{- end }}
  {{- with .Values.verifier.did }}
  did: {{ . | quote }}
  {{- end }}
  {{- with .Values.verifier.preferredVpFormats }}
  preferred_vp_formats: {{- toYamlPretty . | nindent 4 }}
  {{- end }}
  supported_wallets:
    {{ include "siros-id.displayName" . }}: https://{{ $hostnameWalletFrontend }}{{ $basePathWalletFrontend }}/cb
    {{- range .Values.features.extraWallets }}
    {{ .displayName | quote }}: {{ .url }}/cb
    {{- end }}
  inbound:
    openid4vp:
      token_endpoint: https://{{ $hostnameVerifier }}/token
      {{- with .Values.verifier.presentationTimeout }}
      presentation_timeout: {{ . }}
      {{- end }}
      clients:
        "https://{{ $hostnameWalletFrontend }}{{ $basePathWalletFrontend }}/":
          type: public
          redirect_uri: https://{{ $hostnameWalletFrontend }}{{ $basePathWalletFrontend }}/cb
          scopes: {{- include "siros-id.vc.credentialScopes" . | nindent 12 }}
        {{- range .Values.features.extraWallets }}
        {{ .url | urlquery | quote }}:
          type: public
          redirect_uri: {{ .url }}/cb
          scopes: {{- include "siros-id.vc.credentialScopes" $ | nindent 12 }}
        {{- end }}
      presentation_requests_dir: /pres-reqs
      {{- with .Values.features.credentialTypes }}
      supported_credentials:
        {{- range $id, $data := . }}
        - vct: {{ $data.vct | quote }}
          scopes:
            - {{ $id | quote }}
        {{- end }}
      {{- end }}
  {{- if .Values.verifier.digitalCredentials.enabled }}
  digital_credentials:
    enable: true
    use_jar: {{ .Values.verifier.digitalCredentials.useJar }}
    {{- with .Values.verifier.digitalCredentials.preferredFormats }}
    preferred_formats: {{- toYamlPretty . | nindent 6 }}
    {{- end }}
    {{- with .Values.verifier.digitalCredentials.responseMode }}
    response_mode: {{ . | quote }}
    {{- end }}
    {{- if not (kindIs "invalid" .Values.verifier.digitalCredentials.allowQrFallback) }}
    allow_qr_fallback: {{ .Values.verifier.digitalCredentials.allowQrFallback }}
    {{- end }}
    {{- with .Values.verifier.digitalCredentials.deepLinkScheme }}
    deep_link_scheme: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.verifier.zkCircuits.sources }}
  zk_circuits:
    sources: {{- toYamlPretty . | nindent 6 }}
  {{- end }}
  {{- with .Values.verifier.presets }}
  presets: {{ toYamlPretty . | nindent 4 }}
  {{- end }}
  {{- if .Values.verifier.oidc_provider.enabled }}
  outbound:
    oidc_provider:
      issuer: https://{{ $hostnameVerifier }}
      subject_type: {{ .Values.verifier.oidc_provider.subjectType | default "pairwise" }}
      enable_userinfo: {{ .Values.verifier.oidc_provider.enableUserinfo | default true }}
      {{- range $key, $field := dict "sessionDuration" "session_duration" "codeDuration" "code_duration" "accessTokenDuration" "access_token_duration" "idTokenDuration" "id_token_duration" "refreshTokenDuration" "refresh_token_duration" }}
      {{- with index $.Values.verifier.oidc_provider $key }}
      {{ $field }}: {{ . }}
      {{- end }}
      {{- end }}
      {{- with .Values.verifier.oidc_provider.staticClients }}
      static_clients: {{- toYamlPretty . | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-pres-reqs
  namespace: {{ $ns }}
  {{- include "siros-id.labels" (list . (dict)) | nindent 2 }}
  {{- include "siros-id.annotations" (list . (dict)) | nindent 2 }}
data:
  .empty: "I am here so that the configmap won't ever be empty"
  {{- if .Values.verifier.presentationRequestTemplates }}
  pres-reqs.yaml: |
    templates:
      {{- range $id, $data := .Values.verifier.presentationRequestTemplates }}
      - id: {{ $id | quote }}
        {{- toYamlPretty $data | nindent 8 }}
      {{- end }}
  {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-main
  namespace: {{ $ns }}
  {{- include "siros-id.labels" (list . (dict)) | nindent 2 }}
  {{- include "siros-id.annotations" (list . (dict)) | nindent 2 }}
data:
  config.yaml: | {{- include "siros-id.vc.renderConfig" (list . "siros-id.verifier.config" .Values.verifier.extraConfig) | nindent 4 }}
  secrets.yaml.template: |
    verifier:
      outbound:
        oidc_provider:
          subject_salt: ${OIDC_PROVIDER_SUBJECT_SALT}
