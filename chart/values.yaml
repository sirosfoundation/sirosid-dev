  extraRpOrigins:
    - android:apk-key-hash:6ecHLQH10KiwVBFUGCTwGe+JmK7qdqqgjtojzMi322k
    - android:apk-key-hash:DEvegOak87MZWC6pGyDa3hqKnNwptRv8iTeQssaM2ME
    - android:apk-key-hash:GQ2BxyCHKNHPJZNdbHXOS4qjaAyKmn2L/xrilXv4ivA
    - android:apk-key-hash:QjozcKdtxyF0wvpLJux1zAi4tQvQ0YjTvwQKtavKe3w
    - android:apk-key-hash:uVM73oLq5x4fV43U6MG9HnEstc4OJ709UEBfZDDO56I

walletFrontend:
