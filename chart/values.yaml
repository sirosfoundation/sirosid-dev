secrets:
  r2psMain:
    name: r2ps-main
    properties:
      - hsmPin
  walletBackendMain:
    name: wallet-backend-main
    properties:
      - jwtSecret
      - adminToken
  issuerRegistryMain:
    name: issuer-registry-main
    properties:
      - adminGuiPassword
  issuerCoreMain:
    name: issuer-core-main
    properties:
      # Like mongoBackupMain below, and for the same reason: this one is
      # NOT produced by the secret generator. A BBS secret key has to be
      # the real scalar matching issuer.core.bbs.publicKey, and a random
      # 32 bytes is a perfectly well-formed scalar that is not it - the
      # issuer would start, sign, and produce credentials nothing can
      # verify. Create the issuer-core-main Secret yourself when enabling
      # issuer.core.bbs, or use issuer.core.bbs.secretKeyPath instead.
      - bbsSecretKey
  issuerApigwMain:
    name: issuer-apigw-main
    properties:
      - oidcProviderClientSecret
      - apiAuthOidcClientSecret
  verifierMain:
    name: verifier-main
    properties:
      - oidcProviderSubjectSalt
  mongoBackupMain:
    name: mongo-backup-main
    properties:
      # The CronJob reads this exact key (templates/05-mongo-backup.yaml's
      # AWS_SECRET_KEY secretKeyRef); it was previously declared as
      # s3CredentialFileContent, which nothing reads. Unlike the other
      # entries here this one is NOT produced by the secret generator - an
      # S3 secret key has to be the real credential, not a random string -
      # so create the mongo-backup-main Secret yourself when enabling
      # mongoBackup.
      - s3SecretKey

networkPolicies:
  kubeApiserverPort: 6443
  ciliumNetworkPolicies: false
