global:
  # PullPolicy and PullSecrets overrides for all images
  imagePullSecrets: []
  imagePullPolicy: ""
  # Labels and annotations applied to all resources
  commonLabels: {}
  commonAnnotations: {}
  # do not specify labelSelector or matchLabelKeys here, they are set in the templates
  topologySpreadConstraints: []
  clusterDomain: "cluster.local"
  service:
    trafficDistribution: ""
  certManager:
    # Use certManager to create issuers used for client certificates and credential signing
    createIssuers: true
    clientCertificate:
      issuerRef: common
    credentialSigning:
      issuerRef: creds
      privateKeyAlgorithm: ECDSA
      privateKeySize: 256

tenant:
  # Logical tenant identifier, used in configs and hostnames
  id: ""
  # If empty, .Release.Namespace will be used. But should this even be a thing? Helm can manage the namespace right?
  namespace: ""
  displayName: ""

gateway:
  # Shared Gateway to attach HTTPRoutes to
  name: ""
  namespace: ""

domain:
  # Base domain used for building hostnames; you can override each hostname explicitly if needed.
  root: ""

# Optional overrides; defaults are built from tenant.id and domain.root in templates
hostnames:
  issuerRegistry: ""
  issuer: ""
  verifier: ""
  walletBackend: ""
  walletFrontend: ""

features:
  # Set production mode to false for development mode with debug logging
  production: false
  singleTenant: true
  createNamespace: true
  generateSecrets: true
  requireInvite: true
  otlpCollector: false
  branding:
    # Only PNG images are supported (used by verifier and issuer-apigw)
    faviconDataUrl: ""
    logoDataUrl: ""
  # Example configuration for extra issuers and verifiers (used by PDP and wallet-backend)
  # extraIssuers:
  #   - displayName: "Foobar Inc. - Primary"
  #     url: https://issuer-1.example.com
  #   - displayName: "Foobar Inc. - Secondary"
  #     url: https://issuer-2.example.com
  #     clientId: "not-the-default-frontend-base-url"
  # extraVerifiers:
  #   - displayName: "Foobar Inc."
  #     url: https://verifier.example.com
  extraIssuers: []
  extraVerifiers: []
  # Example configuration for extra wallets (used by verifier and issuer-apigw)
  # extraWallets:
  #   - displayName: "Foobar Inc."
  #     url: https://wallet.example.com/id/foobar
  extraWallets: []
  # Example configuration for extra credential types (used by issuer components, verifier and
  # registry in wallet-backend)
  # credentialTypes:
  #   "demo_2":
  #     vct: urn:demo:2
  #     format: dc+sd-jwt
  #     issuance:
  #       authProvider: openid4vp
  #       source: "datastore"
  #       authOptions:
  #         scopes:
  #           pid_1_5:
  #             claims:
  #               - given_name
  #               - birthdate
  #     vctm:
  #       data: <JSON STRING DATA>
  #   "demo_3":
  #     vct: urn:demo:3
  #     format: dc+sd-jwt
  #     issuance:
  #       authProvider: oidc
  #       source: "datastore" # or "assertion" if the credential should be built dynamically via oidc claims
  #       authOptions:
  #         claims:
  #           - given_name
  #           - family_name
  #           - birthdate 
  #     vctm:
  #       file: config/demo/vctm_demo_3.json
  #   # An ISO 18013-5 mdoc type carries an MDDL schema instead of a VCTM.
  #   # Set mdocSchema (not vctm) and format: mso_mdoc - vc validates that an
  #   # mso_mdoc scope has mddl_file_path and rejects vctm_file_path.
  #   "org.iso.18013.5.1.mDL":
  #     doctype: org.iso.18013.5.1.mDL
  #     format: mso_mdoc
  #     issuance:
  #       authProvider: oidc
  #       source: "datastore"
  #       authOptions:
  #         claims:
  #           - given_name
  #           - family_name
  #     mdocSchema:
  #       file: config/demo/mdl.mdoc.json
  # Either of vctm/mdocSchema may instead be fetched at runtime by setting
  # vctmUrl/mddlUrl on the type, in which case no file is mounted for it.
  credentialTypes: {}

pdp:
  # whitelist_template uses extraIssuers and extraVerifiers to build a URL whitelist
  # and ignores any other configuration.
  default_whitelist: true
  externalUrl: "http://pdp"
  # See go-trust config for more details.
  # https://github.com/sirosfoundation/go-trust/
  extraRegistries: {}
  # Deep-merged over the rendered PDP config; see siros-id.vc.renderConfig.
  # Reaches the parts of go-trust's config this chart doesn't model
  # (policies, always/never-trusted, OIDFed trust anchors, cache TTLs,
  # additional_trusted_roots) without hand-writing all of extraRegistries.
  # A list here REPLACES the list it merges over.
  extraConfig: {}

issuer:
  # max 1MB in total, use the API if you need more, since the feature is for quick testing.
  # !!! credentials are only added on initialization of the database !!!
  identitymappingImport:
    identities: {}
    users: []
  datastoreImport:
    documents: {}
    users: []
  datasourceAssertion: {}
  apiAuth:
    jwks:
      enabled: false
      jwksData: ""
      issuer: ""
    oidc:
      enabled: false
      issuerUrl: ""
      clientId: ""
      redirectUri: ""
      scopes: ["openid", "email"]
  authProviders:
    oidc:
      enabled: false
      #issuerUrl: "https://demo-sso.common.siros.org/realms/demo"
      #clientId: "demo-issuer-shared"
      issuerUrl: ""
      clientId: ""
      # Seconds an OIDC login session stays valid. Unset uses vc's default.
      sessionDuration: ~

  # Per-service settings for the three issuance-side deployments. They share
  # one config schema but are three separate services: apigw is the public
  # OpenID4VCI face, core is an internal gRPC signing service, registry holds
  # the token status lists.
  apigw:
    cors:
      # allowed_origins is derived from the wallet frontend plus
      # features.extraWallets; these are appended to that, for origins that
      # are not a wallet - a separate admin UI, or a developer's own host.
      # Appending rather than replacing matters: the derived entry follows
      # the frontend hostname, so replacing the list silently breaks CORS
      # for any deployment whose frontend is not where you expected.
      extraAllowedOrigins: []
      # Only needed if a client sends methods/headers outside vc's own
      # defaults.
      allowedMethods: []
      allowedHeaders: []
    openid4vci:
      # Unset uses vc's default of authorization_code plus
      # urn:ietf:params:oauth:grant-type:pre-authorized_code. Narrowing this
      # turns off a whole issuance flow, so set it deliberately.
      grantTypes: []
      refreshTokenDuration: ~
    # See verifier.walletAttestation - same block, issuance side.
    walletAttestation:
      enabled: false
      mode: ""
      policy: {}
    extraConfig: {}
  core:
    jwtAttribute:
      # Unset leaves vc's own defaults for both.
      enableNotBefore: ~
      validDuration: ~
    mdoc:
      # certificate_chain_path is always the signing chain; these two are the
      # only tunable parts. Unset uses vc's defaults (8760h, SHA-256).
      defaultValidity: ""
      digestAlgorithm: ""
    # Attach a random pseudonym_seed claim, for ZK pairwise-pseudonym
    # derivation. Unset leaves it out of the config entirely.
    pseudonymSeed: ~
    # Blind BBS issuance - the "jwp" credential format.
    #
    # Disabled leaves the `bbs:` section out of the issuer config entirely,
    # which is what turns the format off. Keep it a flag rather than
    # inferring from the keys below: an issuer image built without
    # `-tags bbsnative` REFUSES TO START when this section is present, so a
    # deployment rolling onto such an image needs a way to switch the
    # feature off without deleting its key configuration.
    bbs:
      enabled: false
      # The issuer's key pair.
      #
      # Not key_config above, and not cert-manager: a BBS secret key is a
      # BLS12-381 scalar consumed inside the signing algebra rather than a
      # key that signs a digest, so no PKCS#11 HSM can hold one and no CA
      # can issue one. Generate the pair with zk-cred-bbs's `bbs-keygen`.
      #
      # The public half is not secret and belongs here. The secret half
      # does NOT: it comes from the issuer-core-main Secret via the
      # secrets renderer (see secrets.issuerCoreMain below), so it never
      # appears in the rendered ConfigMap.
      publicKey: ""
      # For a deployment that can mount the key material as files instead.
      # Set at most one of publicKey/publicKeyPath, and if secretKeyPath is
      # set the Secret and its renderer are not used at all.
      publicKeyPath: ""
      secretKeyPath: ""
      # How long an issued credential is valid for. Unset uses vc's default
      # (8760h).
      defaultValidity: ""
    extraConfig: {}
  registry:
    # From the registry documentation: "SectionSize is the number of entries (decoys) per section."
    # Increasing/decreasing this value will affect required CPU/memory to generate decoy entries
    # and affect risk of information leakage. First boot builds this many
    # entries in memory as one slice before a single bulk insert, so a small
    # machine needs a smaller value.
    sectionSize: 1000000
    tokenRefreshInterval: ""
    rateLimitRequestsPerMinute: ~
    adminGui:
      enabled: false
      username: "admin"
    extraConfig: {}
verifier:
  oidc_provider:
    enabled: true
    subjectType: pairwise
    enableUserinfo: true
    # Token/session lifetimes in seconds. Unset means "use vc's own default"
    # (session 3600, code 300, access 3600, id 3600, refresh 86400) rather
    # than zero - don't set these to 0 to mean "default".
    sessionDuration: ~
    codeDuration: ~
    accessTokenDuration: ~
    idTokenDuration: ~
    refreshTokenDuration: ~
    # Confidential OIDC clients of the verifier's own OP, for relying parties
    # that log users in via a presentation. Each entry:
    #   - client_id, client_secret, client_name
    #     redirect_uris: [], allowed_scopes: []
    #     token_endpoint_auth_method, grant_types: [], response_types: []
    # A client_secret belongs in the secrets file, not here.
    staticClients: []
  # How this verifier identifies itself in an OpenID4VP request. Empty uses
  # vc's default, "x509_san_dns", which derives the client_id from
  # public_url - so the PDP whitelist entry must match the public hostname.
  # "did" instead publishes /.well-known/did.json and requires `did` below.
  clientIdScheme: ""
  did: ""
  # Informational VP formats/algorithms advertised to wallets, e.g.
  #   "dc+sd-jwt": {sd-jwt_alg_values: [ES256], kb-jwt_alg_values: [ES256]}
  # This is a top-level verifier field in vc's schema, NOT a member of
  # inbound.openid4vp - nesting it there silently does nothing, since vc
  # unmarshals its config non-strictly.
  preferredVpFormats: {}
  # Seconds a presentation may stay pending. Unset uses vc's default (300).
  presentationTimeout: ~
  # W3C Digital Credentials API (browser-mediated presentation).
  digitalCredentials:
    enabled: false
    # Send the request object as a signed JWT (JAR) rather than plain JSON.
    useJar: false
    # Preferred credential formats, most-preferred first. Unset uses vc's
    # default ["vc+sd-jwt", "dc+sd-jwt", "mso_mdoc"].
    preferredFormats: []
    # One of dc_api.jwt (encrypted), direct_post.jwt (signed), direct_post.
    # Unset uses vc's default, dc_api.jwt.
    responseMode: ""
    # Fall back to a QR code when the browser has no DC API. Unset uses
    # vc's default (true).
    allowQrFallback: ~
    deepLinkScheme: ""
  # Accept provider-signed wallet attestations instead of requiring every
  # wallet to be pre-registered as a client. See
  # siros-id.vc.config.walletAttestation for what `mode` pins.
  walletAttestation:
    enabled: false
    mode: ""
    policy: {}
  # Mirrors of the zk-circuits catalog, tried in order. Only consulted by
  # verifier images built with the `zknative` tag. Unset uses vc's default
  # (https://zk-circuits.fly.dev).
  zkCircuits:
    sources: []
  # Deep-merged over everything above; see siros-id.vc.renderConfig. Use for
  # parts of vc's verifier config this chart doesn't model. Two rules:
  #   - it is rooted at the WHOLE config file, so it needs the `verifier:`
  #     (or `common:`) wrapper - omitting it silently writes a top-level key
  #     vc ignores, since vc unmarshals non-strictly;
  #   - a list here REPLACES the list it merges over, it does not append.
  # extraConfig:
  #   verifier:
  #     credential_display:
  #       enable: true
  #   common:
  #     log:
  #       level: debug
  extraConfig: {}
  # Example configuration for extra presentation request templates
  # presentationRequestTemplates:
  #   "demo_3-all":
  #     enabled: true
  #     name: "demo_3 - All claims"
  #     description: "Request all claims for demo credentials"
  #     version: "1.0"
  #     oidc_scopes:
  #       - "demo_3-all"
  #     dcql:
  #       credentials:
  #         - id: "demo_3"
  #           format: "dc+sd-jwt"
  #           meta:
  #             vct_values:
  #               - "urn:demo:3"
  #           claims:
  #             - path: ["given_name"]
  #             - path: ["family_name"]
  #             - path: ["email"]
  #     claim_mappings:
  #       "*": "*"
  presentationRequestTemplates: {}
  presets: {}

walletBackend:
  # Deep-merged over the rendered backend.yaml / registry.yaml; see
  # siros-id.vc.renderConfig. Reaches parts of go-wallet-backend's config
  # this chart doesn't model (wallet_provider/WIA, AS rules, storage
  # backends). A list here REPLACES the list it merges over.
  extraConfig: {}
  registryExtraConfig: {}
  # oidcGate uses the following redirectURI: https://<frontend-url>/id/<tenant-id>/oidc/cb
  # oidcGate:
