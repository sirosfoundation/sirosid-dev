# EU Business Wallet presentation requests - the WE BUILD attestations this
# stack issues (values-base.yaml credentialTypes ebw_oid/eucc/eu_poa/iban_ov,
# and the PA4 three: vat_id/einvoice/ereceipt).
#
# As with eudi_pid.yaml, every vct and claim path here must match what is
# actually issued: the VCTMs in fixtures/vc-metadata/vctm_{ebw_oid,eucc,eu_poa,iban_ov}.json
# (copies of registry.siros.org's webuild-consortium entries), and the claim
# names in fixtures/vc-bootstrapping/*.json.
templates:
  - id: "ebw_oid_owner"
    name: "EU Business Wallet - Owner Identification (EBW-OID)"
    description: "Which legal person owns this business wallet"
    version: "1.0"
    oidc_scopes:
      - "ebw_oid"
    dcql:
      credentials:
        - id: "ebw_oid"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "uri:eu.ebw.oid.1"
          claims:
            - path: ["id"]
            - path: ["name"]
            - path: ["issuing_authority"]
            - path: ["issuing_country"]
            - path: ["date_of_expiry"]
    claim_mappings:
      id: "legal_person_id"
      name: "legal_person_name"
      issuing_authority: "issuing_authority"
      issuing_country: "issuing_country"
      date_of_expiry: "date_of_expiry"
    enabled: true

  - id: "eucc_company_extract"
    name: "EU Company Certificate - Register Extract"
    description: "Company identity, status, activity and legal representatives from the business register"
    version: "1.0"
    oidc_scopes:
      - "eucc"
    dcql:
      credentials:
        - id: "eucc"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "urn:eudi:eucc:1"
          claims:
            - path: ["legal_person_name"]
            - path: ["legal_person_id"]
            - path: ["legal_form_type"]
            - path: ["registration_member_state"]
            - path: ["legal_person_status"]
            - path: ["legal_person_activity", "code"]
            - path: ["legal_representative"]
            - path: ["registered_address", "full_address"]
            - path: ["issuing_authority"]
    claim_mappings:
      legal_person_name: "legal_person_name"
      legal_person_id: "legal_person_id"
      legal_form_type: "legal_form_type"
      registration_member_state: "registration_member_state"
      legal_person_status: "legal_person_status"
      legal_person_activity: "legal_person_activity"
      legal_representative: "legal_representative"
      registered_address: "registered_address"
      issuing_authority: "issuing_authority"
    enabled: true

  - id: "eu_poa_representation"
    name: "EU Power of Attorney - Representation Check"
    description: "Who may represent which company, with which powers and until when"
    version: "1.0"
    oidc_scopes:
      - "eu_poa"
    dcql:
      credentials:
        - id: "eu_poa"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "uri:eu.eudi.eu-poa.1"
          claims:
            - path: ["attorney_full_name"]
            - path: ["principal_full_name"]
            - path: ["company_statutory_full_name"]
            - path: ["euid_reference"]
            - path: ["scope_of_representation_powers"]
            - path: ["scope_of_representation_power_of_substitution"]
            - path: ["validity_period_valid_from"]
            - path: ["validity_period_valid_until"]
            - path: ["issuing_authority"]
    claim_mappings:
      attorney_full_name: "attorney_full_name"
      principal_full_name: "principal_full_name"
      company_statutory_full_name: "company_name"
      euid_reference: "euid"
      scope_of_representation_powers: "powers"
      scope_of_representation_power_of_substitution: "substitution"
      validity_period_valid_from: "valid_from"
      validity_period_valid_until: "valid_until"
      issuing_authority: "issuing_authority"
    enabled: true

  - id: "iban_ov_account"
    name: "IBAN Ownership Verification - Company Account"
    description: "Which bank account belongs to the company, and through whom"
    version: "1.0"
    oidc_scopes:
      - "iban_ov"
    dcql:
      credentials:
        - id: "iban_ov"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "eu.we-build.iban-ov.1"
          claims:
            - path: ["bank_account", "iban"]
            - path: ["bank_account", "account_name"]
            - path: ["bank_account", "account_currency"]
            - path: ["account_ownership", "owner_name"]
            - path: ["account_ownership", "owner_type"]
            - path: ["account_ownership", "legal_person_identifiers"]
            - path: ["account_provider", "provider_name"]
            - path: ["account_provider", "bic_swift"]
    claim_mappings:
      bank_account: "bank_account"
      account_ownership: "account_ownership"
      account_provider: "account_provider"
    enabled: true

  # ---------------------------------------------------------------- PA4 ----
  # The three PA4 attestations. Each request is a real counterparty check
  # rather than "give me everything", because what a verifier may leave out
  # is the part worth demonstrating.

  - id: "vat_id_registration"
    name: "VAT Identification - Registration Check"
    description: "Whether a VAT number is valid, whose it is, and whether it covers EU cross-border trade"
    version: "1.0"
    oidc_scopes:
      - "vat_id"
    dcql:
      credentials:
        - id: "vat_id"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "uri:eu.eudi.vat.2"
          claims:
            # rb-vat-id 5.1 puts these in plain text - the VAT number and the
            # name it belongs to cannot be withheld from anyone holding the
            # attestation at all.
            - path: ["administrative_unit", "vat_id"]
            - path: ["administrative_unit", "name"]
            - path: ["administrative_unit", "registered_eu_cross_border_transactions"]
            # Disclosable, so the holder decides. Asking for it here is what
            # makes the consent screen show a real choice.
            - path: ["administrative_unit", "organisation_type"]
            - path: ["issuer", "vat_id_authentic_source"]
            - path: ["issuer", "authentic_source_country"]
    claim_mappings:
      administrative_unit: "administrative_unit"
      issuer: "issuer"
    enabled: true

  - id: "einvoice_payable"
    name: "eInvoice - Payable Check"
    description: "Who invoiced whom, for how much, and whether the invoice is still open"
    version: "1.0"
    oidc_scopes:
      - "einvoice"
    dcql:
      credentials:
        - id: "einvoice"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "eu.we-build:einvoice:1"
          claims:
            - path: ["invoiceNumber"]
            - path: ["issueDate"]
            - path: ["amountDueForPayment"]
            - path: ["InvoiceCurrencyCode"]
            - path: ["invoiceTotalVatAmount"]
            - path: ["invoiceLifecycleStatus"]
            - path: ["seller", "name"]
            - path: ["seller", "vat"]
            - path: ["buyer", "name"]
            - path: ["buyer", "vat"]
            # paymentInstructions is deliberately NOT requested. rb-eInvoice 5
            # is the only MUST row in the table: the issuer SHALL make it
            # selectively disclosable "so payment details can be withheld
            # where not required". A payable check is exactly that case.
    claim_mappings:
      seller: "seller"
      buyer: "buyer"
      invoiceNumber: "invoice_number"
      issueDate: "issue_date"
      amountDueForPayment: "amount_due"
      InvoiceCurrencyCode: "currency"
      invoiceTotalVatAmount: "vat_total"
      invoiceLifecycleStatus: "status"
    enabled: true

  - id: "ereceipt_expense_claim"
    name: "eReceipt - Expense Claim"
    description: "A receipt submitted to an expense system: what was spent, when, and the VAT to reclaim"
    version: "1.0"
    oidc_scopes:
      - "ereceipt"
    dcql:
      credentials:
        - id: "ereceipt"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "eu.we-build.ereceipt.1"
          claims:
            - path: ["receipt_number"]
            - path: ["receipt_timestamp"]
            - path: ["type"]
            - path: ["currency_iso_code"]
            - path: ["total_price_inc_vat"]
            - path: ["total_price_exc_vat"]
            - path: ["total_vat_amount"]
            # The whole merchant object, because merchant.name does not exist
            # as a claim: `merchant` is a $ref in the schema and the generator
            # does not resolve one, so there is nothing finer to ask for.
            # sirosfoundation/registry-cli#63.
            - path: ["merchant"]
            # products and vats are MUST-disclosable per rb-e-receipt 3. An
            # expense system wants the line items; a VAT-only check would ask
            # for vats alone, which is the privacy case the rulebook is for.
            - path: ["vats"]
    claim_mappings:
      receipt_number: "receipt_number"
      receipt_timestamp: "receipt_timestamp"
      type: "receipt_type"
      currency_iso_code: "currency"
      total_price_inc_vat: "total_inc_vat"
      total_price_exc_vat: "total_exc_vat"
      total_vat_amount: "vat_amount"
      merchant: "merchant"
      vats: "vat_breakdown"
    enabled: true
