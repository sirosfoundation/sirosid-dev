<svg xmlns="http://www.w3.org/2000/svg" width="365" height="243" viewBox="0 0 365 243">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a365d"/><stop offset="1" stop-color="#2c5282"/></linearGradient>
</defs>
<rect width="365" height="243" rx="14.5" fill="url(#bg)"/>
<text x="22" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Photo ID</text>
<text x="343" y="40" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5" fill="#bee3f8">SIROS</text>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="22" y="78" font-size="9" fill="#bee3f8">SURNAME</text>
<text x="22" y="94" font-size="14" font-weight="bold">{{family_name}}</text>
<text x="22" y="114" font-size="9" fill="#bee3f8">GIVEN NAMES</text>
<text x="22" y="130" font-size="14" font-weight="bold">{{given_name}}</text>
<text x="22" y="150" font-size="9" fill="#bee3f8">DATE OF BIRTH</text>
<text x="22" y="165" font-size="12">{{birth_date}}</text>
<text x="160" y="150" font-size="9" fill="#bee3f8">NATIONALITY</text>
<text x="160" y="165" font-size="12">{{nationality}}</text>
<text x="22" y="185" font-size="9" fill="#bee3f8">VALID UNTIL</text>
<text x="22" y="200" font-size="12">{{expiry_date}}</text>
</g>
<text x="22" y="224" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#bee3f8">ISO/IEC TS 23220 · eu.europa.ec.eudi.photoid.1</text>
</svg>
