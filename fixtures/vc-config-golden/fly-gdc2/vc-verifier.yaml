common:
  credential_metadata:
    diploma:
      format: dc+sd-jwt
      vctm_file_path: /vctms/diploma.json
    ehic:
      format: dc+sd-jwt
      vctm_file_path: /vctms/ehic.json
    mdl:
      doctype: org.iso.18013.5.1.mDL
      format: mso_mdoc
      mddl_file_path: /vctms/mdl.mdoc.json
    mdl_zk4:
      doctype: org.iso.18013.5.1.mDL
      format: mso_mdoc
      mddl_file_path: /vctms/mdl_zk4.mdoc.json
    pid_1_5:
      format: dc+sd-jwt
      vctm_file_path: /vctms/pid_1_5.json
    pid_1_8:
      format: dc+sd-jwt
      vctm_file_path: /vctms/pid_1_8.json
    pid_mdoc:
      doctype: eu.europa.ec.eudi.pid.1
      format: mso_mdoc
      mddl_file_path: /vctms/pid_mdoc.mdoc.json
    siros_id:
      format: dc+sd-jwt
      vctm_file_path: /vctms/siros_id.json
  ha:
    cache_database_name: verifier_cache
    enable: true
  mongo:
    uri: mongodb://<redacted>@sirosid-gdc2-mongodb.internal:27017/?authSource=admin
  production: false
  tracing:
    addr: otlp-collector:4318
    enable: false
verifier:
  api_server:
    addr: :8080
  digital_credentials:
    auto_attempt: false
    enable: true
    use_jar: false
  inbound:
    openid4vp:
      clients:
        https://sirosid-gdc2-wallet-frontend.fly.dev/id/default/:
          redirect_uri: https://sirosid-gdc2-wallet-frontend.fly.dev/id/default/cb
          scopes:
          - diploma
          - ehic
          - mdl
          - mdl_zk4
          - pid_1_5
          - pid_1_8
          - pid_mdoc
          - siros_id
          type: public
      presentation_requests_dir: /pres-reqs
      presentation_timeout: 300
      supported_credentials:
      - scopes:
        - diploma
        vct: urn:eudi:diploma:1
      - scopes:
        - ehic
        vct: urn:eudi:ehic:1
      - scopes:
        - mdl
        vct: org.iso.18013.5.1.mDL
      - scopes:
        - mdl_zk4
        vct: org.iso.18013.5.1.mDL
      - scopes:
        - pid_1_5
        vct: urn:eudi:pid:arf-1.5:1
      - scopes:
        - pid_1_8
        vct: urn:eudi:pid:arf-1.8:1
      - scopes:
        - pid_mdoc
        vct: eu.europa.ec.eudi.pid.1
      - scopes:
        - siros_id
        vct: https://registry.siros.org/sirosfoundation/siros_id.vctm.json
      token_endpoint: https://sirosid-gdc2-vc-verifier.fly.dev/token
  key_config:
    chain_path: /pki/signing_ec_chain.pem
    private_key_path: /pki/signing_ec_private.pem
  outbound:
    oidc_provider:
      access_token_duration: 3600
      code_duration: 600
      enable_userinfo: true
      id_token_duration: 3600
      issuer: https://sirosid-gdc2-vc-verifier.fly.dev
      refresh_token_duration: 86400
      session_duration: 900
      subject_type: pairwise
      subject_salt: <redacted>
  preferred_vp_formats:
    dc+sd-jwt:
      kb-jwt_alg_values:
      - ES256
      sd-jwt_alg_values:
      - ES256
  presets:
    Age Over 18 - ZK Proof (Vega):
      category: ZK Proofs
      credentials:
        mdl_zk4:
          claims:
          - path:
            - org.iso.18013.5.1
            - age_over_18
          format: mso_mdoc_zk
          zk_system_type:
          - id: vega-mc-p256-v1-prover-key-r12
            system: vega-mc-p256-v1
    PID (mdoc) - ZK Proof (Vega):
      category: ZK Proofs
      credentials:
        mdl_zk4:
          claims:
          - path:
            - org.iso.18013.5.1
            - family_name
          - path:
            - org.iso.18013.5.1
            - given_name
          format: mso_mdoc_zk
          zk_system_type:
          - id: vega-mc-p256-v1-prover-key-r12
            system: vega-mc-p256-v1
  public_url: https://sirosid-gdc2-vc-verifier.fly.dev
  supported_wallets:
    SIROS ID (dev): https://sirosid-gdc2-wallet-frontend.fly.dev/id/default/cb
    SIROS Native App: openid4vp://cb
  trust:
    pdp_url: http://sirosid-gdc2-pdp.internal:8080
