common:
  credential_metadata:
    diploma:
      format: dc+sd-jwt
      vctm_file_path: /vctms/diploma.json
    ehic:
      format: dc+sd-jwt
      vctm_file_path: /vctms/ehic.json
    mdl:
      doctype: org.iso.18013.5.1.mDL
      format: mso_mdoc
      mddl_file_path: /vctms/mdl.mdoc.json
    mdl_zk4:
      doctype: org.iso.18013.5.1.mDL
      format: mso_mdoc
      mddl_file_path: /vctms/mdl_zk4.mdoc.json
    pid_1_5:
      format: dc+sd-jwt
      vctm_file_path: /vctms/pid_1_5.json
    pid_1_8:
      format: dc+sd-jwt
      vctm_file_path: /vctms/pid_1_8.json
    pid_mdoc:
      doctype: eu.europa.ec.eudi.pid.1
      format: mso_mdoc
      mddl_file_path: /vctms/pid_mdoc.mdoc.json
    siros_id:
      format: dc+sd-jwt
      vctm_file_path: /vctms/siros_id.json
  ha:
    cache_database_name: issuer-core_cache
    enable: true
  mongo:
    uri: mongodb://<redacted>@sirosid-gdc2-mongodb.internal:27017/?authSource=admin
  production: false
  tracing:
    addr: otlp-collector:4318
    enable: false
issuer:
  api_server:
    addr: :8081
  grpc_server:
    addr: :8090
    tls:
      allowed_client_dns:
        issuer-apigw: CN=issuer-apigw-client,OU=clients,O=siros-id
      cert_file_path: /server-cert/tls.crt
      client_ca_path: /server-cert/ca.crt
      enable: false
      key_file_path: /server-cert/tls.key
  issuer_url: https://sirosid-gdc2-vc-apigw.fly.dev
  jwt_attribute:
    enable_not_before: true
    issuer: https://sirosid-gdc2-vc-apigw.fly.dev
    valid_duration: 3600
    verifiable_credential_type: https://credential.e2etest.local/identity_credential
  key_config:
    chain_path: /pki/signing_ec_chain.pem
    private_key_path: /pki/signing_ec_private.pem
  mdoc:
    certificate_chain_path: /pki/signing_ec_chain.pem
  pseudonym_seed: true
  registry_client:
    addr: sirosid-gdc2-vc-registry.internal:8090
    ca_file_path: /client-cert/ca.crt
    cert_file_path: /client-cert/tls.crt
    key_file_path: /client-cert/tls.key
    server_name: issuer-registry
    tls: false
