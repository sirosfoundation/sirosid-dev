common:
  production: false
  ha:
    enable: true
  mongo:
    uri: mongodb://<redacted>@sirosid-gdc-mongodb.internal:27017/?authSource=admin
  tracing:
    addr: localhost:4318
    timeout: 1
  credential_metadata:
    pid_1_8:
      vctm_file_path: /metadata/vctm_pid_arf_1_8.json
      format: dc+sd-jwt
    pid_1_5:
      vctm_file_path: /metadata/vctm_pid_arf_1_5.json
      format: dc+sd-jwt
    ehic:
      vctm_file_path: /metadata/vctm_ehic.json
      format: dc+sd-jwt
    diploma:
      vctm_file_path: /metadata/vctm_diploma.json
      format: dc+sd-jwt
    siros_id:
      vctm_file_path: /metadata/vctm_siros_id.json
      format: dc+sd-jwt
    mdl:
      mddl_file_path: /metadata/mdl.mdoc.json
      format: mso_mdoc
    pid_mdoc:
      mddl_file_path: /metadata/pid_mdoc.mdoc.json
      format: mso_mdoc
    mdl_zk4:
      mddl_file_path: /metadata/mdl_zk4.mdoc.json
      format: mso_mdoc
registry:
  api_server:
    addr: :8080
    tls:
      enable: false
  grpc_server:
    addr: :8090
  public_url: https://sirosid-gdc-vc-registry.fly.dev
  token_status_lists:
    key_config:
      private_key_path: /pki/signing_ec_private.pem
      chain_path: /pki/signing_ec_chain.pem
    section_size: 10000
  admin_gui:
    enable: true
    password: <redacted>
