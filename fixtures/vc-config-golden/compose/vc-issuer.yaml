common:
  production: false
  ha:
    enable: true
  mongo:
    uri: mongodb://mongodb:27017
  tracing:
    addr: localhost:4318
    timeout: 1
  credential_metadata:
    pid_1_8:
      vctm_file_path: /metadata/vctm_pid_arf_1_8.json
      format: dc+sd-jwt
    pid_1_5:
      vctm_file_path: /metadata/vctm_pid_arf_1_5.json
      format: dc+sd-jwt
    ehic:
      vctm_file_path: /metadata/vctm_ehic.json
      format: dc+sd-jwt
    diploma:
      vctm_file_path: /metadata/vctm_diploma.json
      format: dc+sd-jwt
    siros_id:
      vctm_file_path: /metadata/vctm_siros_id.json
      format: dc+sd-jwt
    mdl:
      mddl_file_path: /metadata/mdl.mdoc.json
      format: mso_mdoc
    pid_mdoc:
      mddl_file_path: /metadata/pid_mdoc.mdoc.json
      format: mso_mdoc
    mdl_zk4:
      mddl_file_path: /metadata/mdl_zk4.mdoc.json
      format: mso_mdoc
issuer:
  api_server:
    addr: :8080
    tls:
      enable: false
  grpc_server:
    addr: :8090
  issuer_url: http://vc-apigw.localhost:9003
  registry_client:
    addr: vc-registry:8090
  key_config:
    private_key_path: /pki/signing_ec_private.pem
    chain_path: /pki/signing_ec_chain.pem
  jwt_attribute:
    issuer: http://vc-apigw.localhost:9003
    enable_not_before: true
    valid_duration: 3600
    verifiable_credential_type: https://credential.e2etest.local/identity_credential
  mdoc:
    certificate_chain_path: /pki/signing_ec_chain.pem
  pseudonym_seed: true
