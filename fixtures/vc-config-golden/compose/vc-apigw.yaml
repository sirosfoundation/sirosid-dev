common:
  production: false
  ha:
    enable: true
  mongo:
    uri: mongodb://mongodb:27017
  tracing:
    addr: localhost:4318
    timeout: 1
  credential_metadata:
    pid_1_8:
      vctm_file_path: /metadata/vctm_pid_arf_1_8.json
      format: dc+sd-jwt
    pid_1_5:
      vctm_file_path: /metadata/vctm_pid_arf_1_5.json
      format: dc+sd-jwt
    ehic:
      vctm_file_path: /metadata/vctm_ehic.json
      format: dc+sd-jwt
    diploma:
      vctm_file_path: /metadata/vctm_diploma.json
      format: dc+sd-jwt
    siros_id:
      vctm_file_path: /metadata/vctm_siros_id.json
      format: dc+sd-jwt
    mdl:
      mddl_file_path: /metadata/mdl.mdoc.json
      format: mso_mdoc
    pid_mdoc:
      mddl_file_path: /metadata/pid_mdoc.mdoc.json
      format: mso_mdoc
    mdl_zk4:
      mddl_file_path: /metadata/mdl_zk4.mdoc.json
      format: mso_mdoc
apigw:
  api_server:
    addr: :9003
    tls:
      enable: false
    cors:
      allowed_origins:
      - http://localhost:3000
      - http://localhost:*
      - http://vc-apigw.localhost:9003
      allowed_methods:
      - GET
      - POST
      - OPTIONS
      allowed_headers:
      - Authorization
      - Content-Type
  key_config:
    private_key_path: /pki/signing_ec_private.pem
    chain_path: /pki/signing_ec_chain.pem
  public_url: http://vc-apigw.localhost:9003
  registry_public_url: https://vc-proxy:8445
  issuer_client:
    addr: vc-issuer:8090
  registry_client:
    addr: vc-registry:8090
  identity_mapping_import:
    file_paths:
    - /bootstrapping/identity_mappings.json
  auth_providers:
    oidc:
      enable: true
      issuer_url: http://mini-oidc.localhost:9005
      redirect_uri: http://vc-apigw.localhost:9003/oidcrp/callback
      scopes:
      - openid
      - profile
      session_duration: 300
      registration:
        preconfigured:
          enable: true
          client_id: apigw-oidc-client
          client_secret: <redacted>
  data_sources:
    assertion:
      scopes:
        pid:
          auth_provider: oidc
        pid_1_5:
          auth_provider: oidc
        ehic:
          auth_provider: oidc
    datastore:
      scopes:
        diploma:
          auth_provider: oidc
          auth_claims:
          - given_name
          - family_name
        pid_1_8:
          auth_provider: oidc
          auth_claims:
          - given_name
          - family_name
        mdl:
          auth_provider: oidc
          auth_claims:
          - given_name
          - family_name
        pid_mdoc:
          auth_provider: oidc
          auth_claims:
          - given_name
          - family_name
        mdl_zk4:
          auth_provider: oidc
          auth_claims:
          - given_name
          - family_name
      import:
        file_paths:
        - /bootstrapping/diploma.json
        - /bootstrapping/pid_1_8.json
        - /bootstrapping/mdl.json
        - /bootstrapping/mdl_zk4.json
        - /bootstrapping/pid_mdoc.json
  delivery:
    openid4vci:
      token_endpoint: http://vc-apigw.localhost:9003/token
      grant_types:
      - authorization_code
      - urn:ietf:params:oauth:grant-type:pre-authorized_code
      - refresh_token
      clients:
        e2e-test-client:
          type: public
          redirect_uri:
          - siros-sample://callback
          - http://localhost:3000/id/default/cb
          scopes:
          - pid
          - pid_1_5
          - pid_1_8
          - diploma
          - ehic
          - mdl
          - mdl_zk4
          - pid_mdoc
        e2e-test-client-2:
          type: public
          redirect_uri: http://localhost:3000/id/default/cb
          scopes:
          - pid
          - pid_1_5
          - pid_1_8
          - diploma
          - ehic
          - mdl
          - pid_mdoc
        http://localhost:3000/:
          type: public
          redirect_uri: http://localhost:3000/id/default/cb
          scopes:
          - siros_id
    credential_offers:
      issuer_url: http://vc-apigw.localhost:9003
      wallets:
        local:
          label: SIROS ID (dev)
          redirect_uri: http://localhost:3000/cb
        e2e_test:
          label: E2E Test Wallet
          redirect_uri: http://localhost:3000/callback
        android:
          label: SIROS Android (Waydroid)
          redirect_uri: siros-sample://callback
