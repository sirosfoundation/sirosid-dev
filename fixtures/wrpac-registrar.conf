# Serves a siros-wrpac-tool deployment's public/ directory.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # default_type only applies when nginx does not already know the extension,
    # so .json and .xml need nothing here - and .der needs a types override
    # rather than a default_type, since nginx maps it to x-x509-ca-cert, which
    # a CRL is not.
    location = /lote.json.jws { default_type application/jose; }
    location = /status-list.jwt { default_type application/statuslist+jwt; }
    location = /crl.der { types { application/pkix-crl der; } }

    location / {
        autoindex on;
    }
}
