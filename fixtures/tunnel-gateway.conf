# Same-origin gateway for TUNNELS=yes (docker-compose.tunnel.yml).
#
# Cloudflare quick tunnels give every service its own *.trycloudflare.com
# host, and trycloudflare.com is on the Public Suffix List, so each host is a
# separate *site*. wallet-backend's session cookie is SameSite=Strict (see
# go-wallet-backend internal/as/cookie.go): set by a backend host, it is never
# sent on the frontend's requests, so a passkey login succeeds and the very
# next /auth/token is a 401. Serving the backend under the frontend's own
# origin makes those calls same-origin again. The frontend tunnel points at
# this gateway; the frontend itself moves to host port 3001.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    client_max_body_size 10m;

    # Resolve upstreams per request through Docker's DNS: `make up` recreates
    # wallet-frontend/wallet-backend with new addresses while this container
    # keeps running, and addresses resolved once at startup would go stale.
    # (With a variable in proxy_pass nginx no longer strips the location
    # prefix itself, hence the rewrites.)
    resolver 127.0.0.11 valid=10s;
    set $wallet_backend wallet-backend;
    set $wallet_frontend wallet-frontend;

    # wallet-backend's HTTP API (WALLET_BACKEND_URL=<frontend>/backend).
    location /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$wallet_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # wallet-common's AuthServerClient resolves its endpoints against the
    # origin, not the base URL, so /auth/* arrives here without the prefix.
    location /auth/ {
        proxy_pass http://$wallet_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The engine's WebSocket transport (WS_URL=wss://<frontend>/engine/api/v2/wallet).
    location /engine/ {
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass http://$wallet_backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://$wallet_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
