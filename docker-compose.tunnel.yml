# Docker Compose overlay for Cloudflare tunnel URLs.
#
# Unlike docker-compose.domain.yml (which uses a single hostname), tunnels
# assign a unique *.trycloudflare.com URL per service. This overlay injects
# those URLs into the frontend and backend configuration.
#
# Usage:
#   make up TUNNELS=yes
#
# The frontend reaches wallet-backend through wallet-gateway on its own origin
# (fixtures/tunnel-gateway.conf); the backend/engine tunnels remain for
# callers that address the backend directly.
#
# Requires: .env.tunnel file with TUNNEL_FRONTEND_URL, TUNNEL_BACKEND_URL,
# TUNNEL_ENGINE_URL, and TUNNEL_RPID (created by scripts/tunnel.sh)

services:
  wallet-frontend:
    # The frontend tunnel (host port 3000) now lands on wallet-gateway, which
    # serves the backend under the frontend's own origin - see
    # fixtures/tunnel-gateway.conf for why that is required.
    ports: !override
      - "3001:80"
    environment:
      - WALLET_BACKEND_URL=${TUNNEL_FRONTEND_URL}/backend
      - WALLET_ENGINE_URL=${TUNNEL_FRONTEND_URL}/engine
      # config.ts derives the socket as new URL('/api/v2/wallet', ENGINE_URL),
      # which drops the /engine prefix, so it is spelled out.
      - WS_URL=wss://${TUNNEL_RPID}/engine/api/v2/wallet
      - WEBAUTHN_RPID=${TUNNEL_RPID}
      # /id/default/cb, not the bare origin - see docker-compose.test.yml's
      # own OPENID4VCI_REDIRECT_URI comment; render-helm-config's --hostname keeps
      # e2e-test-client's redirect_uri list in sync with this exact value.
      - OPENID4VCI_REDIRECT_URI=${TUNNEL_FRONTEND_URL}/id/default/cb
      - STATIC_PUBLIC_URL=${TUNNEL_FRONTEND_URL}
      - VCT_REGISTRY_URL=${TUNNEL_FRONTEND_URL}/backend/registry/type-metadata

  wallet-gateway:
    image: nginx:alpine
    container_name: wallet-gateway-e2e
    ports:
      - "3000:3000"
    volumes:
      - ./fixtures/tunnel-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wallet-frontend
      - wallet-backend
    networks:
      - e2e-test-network

  wallet-backend:
    environment:
      # Extract hostname from tunnel URL for WebAuthn RP ID
      - WALLET_SERVER_RP_ID=${TUNNEL_RPID:-trycloudflare.com}
      - WALLET_SERVER_RP_ORIGIN=${TUNNEL_FRONTEND_URL}
      # WALLET_ANDROID_RP_ORIGINS is what `make up` derives from .android-apps /
      # ANDROID_APPS / .env.android (scripts/android_apps.py --rp-origins).
      - WALLET_SERVER_RP_ORIGINS=${TUNNEL_FRONTEND_URL},${WALLET_ANDROID_RP_ORIGINS:-android:apk-key-hash:${APK_KEY_HASH:-xAfybcO0yPlUA_Gko2tH6oIRb9Y-qa3uVtm0m_qW07Q}}
      # The browser/WebView calls the backend from the frontend's tunnel origin;
      # without it every request (starting with /status) fails CORS and the
      # frontend reports the backend as offline.
      - WALLET_SERVER_CORS_ALLOWED_ORIGINS=${TUNNEL_FRONTEND_URL},http://localhost:3000
